name: Build Veil Game Boy Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - veil-cavern-integration
    paths:
      - '.github/workflows/build-veil-gameboy.yml'
      - 'gameboy-veil/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4

      - name: Fetch pinned Cavern-GB foundation
        run: |
          git clone https://github.com/TheGreatGallus/Cavern-GB.git upstream-cavern
          cd upstream-cavern
          git checkout f412101f0d29e402f2975ab8f04ef50740de9b33

      - name: Fetch pinned Yurivania 2 donor
        run: |
          git clone https://github.com/mxashlynn/Yurivania-2.git vendor-yurivania2
          cd vendor-yurivania2
          git checkout e95a78c86184b0185769249feb327240d1a6e980
          find . -type f -not -path './.git/*' -print0 | sort -z | xargs -0 sha256sum > ../YURIVANIA2_SHA256SUMS.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl jq unzip xz-utils python3

      - name: Install GBDK-2020
        run: |
          API_URL=https://api.github.com/repos/gbdk-2020/gbdk-2020/releases/latest
          ASSET_URL=$(curl -fsSL "$API_URL" | jq -r '.assets[] | select(.name | test("linux64.*tar.gz$")) | .browser_download_url' | head -n 1)
          test -n "$ASSET_URL"
          curl -fsSL "$ASSET_URL" -o gbdk.tar.gz
          mkdir -p "$HOME/gbdk"
          tar -xzf gbdk.tar.gz -C "$HOME/gbdk" --strip-components=1

      - name: Apply Veil overlay
        run: |
          if [ -d gameboy-veil/overlay ]; then
            cp -a gameboy-veil/overlay/. upstream-cavern/
          fi
          python3 gameboy-veil/tools/patch_cavern_state.py

      - name: Verify integration hooks
        run: |
          grep -q '#include "VeilRuntime.h"' upstream-cavern/Cavern/src/StateGame.c
          grep -q 'VeilRuntime_Init();' upstream-cavern/Cavern/src/StateGame.c
          grep -q 'if (VeilRuntime_Update())' upstream-cavern/Cavern/src/StateGame.c

      - name: Build ROM
        env:
          GBDK_HOME: ${{ github.workspace }}/../gbdk
          ZGB_PATH: ${{ github.workspace }}/upstream-cavern/ZGB
        run: |
          export GBDK_HOME="$HOME/gbdk"
          export ZGB_PATH="$GITHUB_WORKSPACE/upstream-cavern/ZGB"
          make -C upstream-cavern/Cavern/src
          find upstream-cavern -type f \( -name '*.gb' -o -name '*.gbc' \) -print

      - name: Collect build outputs
        run: |
          mkdir -p dist/licenses dist/manifests
          find upstream-cavern -type f \( -name '*.gb' -o -name '*.gbc' -o -name '*.map' -o -name '*.noi' \) -exec cp {} dist/ \;
          cp gameboy-veil/THIRD_PARTY_LEDGER.csv dist/
          cp YURIVANIA2_SHA256SUMS.txt dist/manifests/
          cp vendor-yurivania2/LICENSE.txt dist/licenses/YURIVANIA2_LICENSE.txt
          cp upstream-cavern/LICENSE dist/licenses/CAVERN_LICENSE.txt
          cp upstream-cavern/ZGB/LICENSE.txt dist/licenses/ZGB_LICENSE.txt
          test -n "$(find dist -type f \( -name '*.gb' -o -name '*.gbc' \) -print -quit)"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS.txt

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: veil-cavern-gameboy-build
          path: dist/
          if-no-files-found: error
